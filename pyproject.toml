[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "marketplace-dynamic-pricing-matching"
version = "1.0.0"
description = "Operations Research Engine for Two-Sided Marketplaces: Coupled Dynamic Pricing & Bipartite Matching"
readme = "README.md"
requires-python = ">=3.9"
authors = [
    { name = "Srihari Malla", email = "srihari175@gmail.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Mathematics",
]
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "matplotlib>=3.7.0"
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["marketplace_opt*"]
